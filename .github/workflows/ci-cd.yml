name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# permissoes minimas para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# evita dois deploys ao mesmo tempo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI (lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node (versao do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
        env:
          # no Pages nao existe o mini-servidor do dev: le o JSON estatico
          VITE_API_URL: /semana10-painel/alunos.json
          BASE_PATH: /semana10-painel/

      - name: Fallback de rotas (SPA no Pages)
        run: cp dist/index.html dist/404.html

      - name: Enviar artefato do site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  cd:
    name: CD (deploy GitHub Pages)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
